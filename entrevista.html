<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Entrevista — ACEFB na sua visão</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="modo-entrevista">
  <header class="logos" aria-label="Parceria">
    <span class="logo-item logo-acefb">
      <img src="assets/acefb-logo.svg" alt="" class="logo-mark" aria-hidden="true" />
      <span class="logo-nome">ACEFB</span>
    </span>
    <span class="logo-item logo-oktoberfest">
      <img src="assets/oktoberfest-logo.png" alt="Oktoberfest Beltrão 2026" class="logo-oktoberfest-img" />
    </span>
    <span class="logo-item logo-evolve">
      <img src="assets/evolve-mark.png" alt="" class="logo-mark" aria-hidden="true" />
      <span class="logo-nome">Evolve</span>
    </span>
  </header>
  <main id="app" aria-live="polite"></main>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML = `
        <section class="aviso-file">
          <h1>Abra pelo servidor local</h1>
          <p>A entrevista usa módulos JavaScript, que o navegador bloqueia quando a página é aberta direto do disco. Faça assim:</p>
          <ol>
            <li>Abra um terminal na pasta do projeto e rode:<br><code>npm start</code></li>
            <li>Depois abra no navegador:<br><code>http://localhost:8765/entrevista.html</code></li>
          </ol>
          <p style="font-size:.85rem;opacity:.65;margin:0">Alternativa sem npm: <code>python3 -m http.server 8765</code></p>
        </section>`;
    }
  </script>
  <script type="module" src="entrevista.js"></script>
</body>
</html>
